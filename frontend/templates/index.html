<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altego Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="top-nav">
        <div class="logo">
            <span class="logo-mark">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
            </span>
            Alteco
        </div>
    </header>

    <main class="dashboard-content">
        <!-- Upload Section -->
        <section class="card upload-section">
            <div class="section-header">
                <h2>Data Upload</h2>
            </div>

            <div class="drop-zones">
                <div class="drop-zone" id="alteco-drop-zone">
                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                    <div class="drop-zone-prompt">
                        <span class="prompt-text">Drag & Drop Alteco File</span>
                        <span class="format-hint">Supported format: .xlsx</span>
                        <div class="file-display" style="display: none;">
                            <span class="file-name" id="alteco-file-name"></span>
                            <button class="remove-file-btn" type="button" aria-label="Remove file">✕</button>
                        </div>
                    </div>
                    <input type="file" class="drop-zone-input" id="alteco-file-input" accept=".xlsx, .csv">
                </div>

                <div class="drop-zone" id="electra-drop-zone">
                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                    <div class="drop-zone-prompt">
                        <span class="prompt-text">Drag & Drop Electra File</span>
                        <span class="format-hint">Supported format: .xlsx</span>
                        <div class="file-display" style="display: none;">
                            <span class="file-name" id="electra-file-name"></span>
                            <button class="remove-file-btn" type="button" aria-label="Remove file">✕</button>
                        </div>
                    </div>
                    <input type="file" class="drop-zone-input" id="electra-file-input" accept=".xlsx, .csv">
                </div>
            </div>

            <div class="action-row">
                <!-- Button is disabled by default -->
                <button id="reconcile-btn" class="btn-primary" disabled>
                    <span class="spinner" style="display: none;"></span>
                    <span class="btn-text">Run</span>
                </button>
            </div>
        </section>

        <!-- Results Section (Hidden initially) -->
        <section id="results-container" class="results-section" style="display: none;">

            <!-- Summary Strip (populated after reconciliation) -->
            <div id="summary-strip" class="summary-strip"></div>

            <!-- Phase 0 Card -->
            <div class="card result-card">
                <div class="phase-body">
                    <div class="card-header">
                        <h3>Meter Coverage</h3>
                        <span id="step0-badge" class="badge"></span>
                    </div>
                    <input type="text" id="step0-search" class="search-input" placeholder="Search by Customer ID, Client Name, or Field..." style="display: none;">
                    <div id="step0-table-container" class="table-scroll-wrapper"></div>
                </div>
            </div>

            <!-- Phase 1 Card -->
            <div class="card result-card">
                <div class="phase-body">
                    <div class="card-header">
                        <h3>Metadata</h3>
                        <span id="step1-badge" class="badge"></span>
                    </div>
                    <input type="text" id="step1-search" class="search-input" placeholder="Search by Customer ID, Client Name, or Field..." style="display: none;">
                    <div id="step1-table-container" class="table-scroll-wrapper"></div>
                </div>
            </div>

            <!-- Phase 2 Card -->
            <div class="card result-card">
                <div class="phase-body">
                    <div class="card-header">
                        <h3>Consumption & Calculations</h3>
                        <span id="step2-badge" class="badge"></span>
                    </div>
                    <input type="text" id="step2-search" class="search-input" placeholder="Search by Customer ID, Client Name, or Field..." style="display: none;">
                    <div id="step2-table-container" class="table-scroll-wrapper"></div>
                </div>
            </div>

            <!-- Phase 3 Card -->
            <div class="card result-card">
                <div class="phase-body">
                    <div class="card-header">
                        <h3>Financial Reconciliation</h3>
                        <span id="step3-badge" class="badge"></span>
                    </div>
                    <input type="text" id="step3-search" class="search-input" placeholder="Search by Customer ID, Client Name, or Original Field..." style="display: none;">
                    <div id="step3-table-container" class="table-scroll-wrapper"></div>
                </div>
            </div>

        </section>
    </main>

    <script src="{{ url_for('static', path='main.js') }}"></script>
</body>
</html>
