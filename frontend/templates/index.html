<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altego Data Reconciliation</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Data Reconciliation Engine</h1>
            <p>Drag and drop the Alteco and Electra files into their respective boxes below.</p>
        </header>

        <div class="drop-zones">
            <!-- Alteco Drop Zone -->
            <div class="drop-zone" id="alteco-drop-zone">
                <div class="drop-zone-prompt">
                    <span class="prompt-text">Drag & Drop Alteco File Here</span>
                    <span class="file-name" id="alteco-file-name"></span>
                </div>
                <input type="file" class="drop-zone-input" id="alteco-file-input" accept=".xlsx, .csv">
            </div>

            <!-- Electra Drop Zone -->
            <div class="drop-zone" id="electra-drop-zone">
                <div class="drop-zone-prompt">
                    <span class="prompt-text">Drag & Drop Electra File Here</span>
                    <span class="file-name" id="electra-file-name"></span>
                </div>
                <input type="file" class="drop-zone-input" id="electra-file-input" accept=".xlsx, .csv">
            </div>
        </div>

        <button id="reconcile-btn">Run Reconciliation</button>

        <!-- Results Section -->
        <div id="results-container">
            <div id="spinner" class="spinner" style="display: none;"></div>
            <h2 id="results-title"></h2>
            <div id="results-table-container">
                <!-- The results table will be dynamically generated here by JavaScript -->
            </div>
        </div>
    </div>

    <!-- JavaScript file -->
    <script src="{{ url_for('static', path='main.js') }}"></script>
</body>
</html>
