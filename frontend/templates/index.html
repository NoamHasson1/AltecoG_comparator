<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altego Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="top-nav">
        <div class="logo">Alteco <span>Billing comparison</span></div>
    </header>

    <main class="dashboard-content">
        <!-- Upload Section -->
        <section class="card upload-section">
            <div class="section-header">
                <h2>Data Upload</h2>
                <p>Drag and drop the Alteco and Electra files to begin the reconciliation process.</p>
            </div>
            
            <div class="drop-zones">
                <div class="drop-zone" id="alteco-drop-zone">
                    <div class="drop-zone-prompt">
                        <span class="prompt-text">Drag & Drop Alteco File</span>
                        <span class="file-name" id="alteco-file-name"></span>
                    </div>
                    <input type="file" class="drop-zone-input" id="alteco-file-input" accept=".xlsx, .csv">
                </div>

                <div class="drop-zone" id="electra-drop-zone">
                    <div class="drop-zone-prompt">
                        <span class="prompt-text">Drag & Drop Electra File</span>
                        <span class="file-name" id="electra-file-name"></span>
                    </div>
                    <input type="file" class="drop-zone-input" id="electra-file-input" accept=".xlsx, .csv">
                </div>
            </div>

            <div class="action-row">
                <div id="spinner" class="spinner" style="display: none;"></div>
                <button id="reconcile-btn" class="btn-primary">Run Reconciliation</button>
            </div>
        </section>

        <!-- Results Section (Hidden initially) -->
        <section id="results-container" class="results-section" style="display: none;">
            
            <!-- Phase 1 Card -->
            <div class="card result-card">
                <div class="card-header">
                    <h3>Phase 1: Metadata</h3>
                    <span id="step1-badge" class="badge"></span>
                </div>
                <!-- This wrapper allows the table to scroll while the card stays fixed -->
                <div id="step1-table-container" class="table-scroll-wrapper"></div>
            </div>

            <!-- Phase 2 Card -->
            <div class="card result-card">
                <div class="card-header">
                    <h3>Phase 2: Consumption & Calculations</h3>
                    <span id="step2-badge" class="badge"></span>
                </div>
                <div id="step2-table-container" class="table-scroll-wrapper"></div>
            </div>

        </section>
    </main>

    <script src="{{ url_for('static', path='main.js') }}"></script>
</body>
</html>
